repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
    hooks:
      - id: typos
        args: [--force-exclude]
  - repo: local
    hooks:
      # Verify Feature Map hygiene automatically once `.pi/skills/verify` or `.claude/skills/verify*` exists.
      - id: verify-map-hygiene
        name: verify map hygiene
        entry: bash scripts/with-tool-path.sh python3 scripts/check-verify-map.py
        language: system
        pass_filenames: false
        files: ^(\.pi/skills/verify|\.claude/skills/verify)

      - id: local-ruff-check
        name: ruff check
        entry: bash scripts/with-tool-path.sh uv run --locked ruff check --force-exclude
        require_serial: true
        language: system
        types: [python]
      - id: local-ruff-format
        name: ruff format
        entry: bash scripts/with-tool-path.sh uv run --locked ruff format --force-exclude --check
        require_serial: true
        language: system
        types: [python]
